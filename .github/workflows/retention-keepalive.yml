# Render (free) hiberna o backend sem tráfego, e o RetentionSweeper só roda com o
# processo de pé (no startup e a cada RETENTION_SWEEP_MINUTES). Como o TTL nativo do
# Firestore não está ativo, este ping de hora em hora acorda o serviço para a retenção
# de 24 h (LGPD) não depender de alguém abrir o app.
name: Retention keepalive

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: retention-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Acordar o backend (dispara a varredura de retenção no startup)
        run: >-
          curl --fail --silent --show-error --retry 3 --retry-delay 20
          --retry-all-errors --max-time 120
          https://clauseai-k1zq.onrender.com/health
