[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clauseai-backend"
version = "0.1.0"
description = "Backend foundation for the ClauseAI MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "firebase-admin>=7.7,<8.0",
  "google-genai>=2.25,<3.0",
  "httpx>=0.27,<1.0",
  "openpyxl>=3.1,<4.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "pypdf>=6.19,<7.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]
samples = [
  "reportlab>=4.2,<6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.infrastructure.knowledge_base" = ["knowledge_base.json"]
"app.infrastructure.ai" = ["prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["firebase_admin.*", "google.cloud.*", "openpyxl.*"]
ignore_missing_imports = true
